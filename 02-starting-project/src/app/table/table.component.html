<table>
  <thead>

      <th>Investement Value</th>
      <th>Interest (Year)</th>
      <th>Total Interest</th>
      <th>Invested Capital</th>
    </tr>
  </thead>
  <tbody>

        <th>{{ investment.year }}</th>

    }
  </tbody>
