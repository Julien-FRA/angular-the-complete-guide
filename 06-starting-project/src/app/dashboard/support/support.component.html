<div>
  <ul>
    @for (ticket of tickets; track ticket.id) {
      <app-ticket
        [ticket]="ticket"
        (updateTicket)="onUpdateTicket(ticket.id)"
      />
    } @empty {
      <p>No tickets available.</p>
    }
  </ul>
</div>

<div id="tickets">
  <app-new-ticket (ticket)="onAddTicket($event)" />
</div>
