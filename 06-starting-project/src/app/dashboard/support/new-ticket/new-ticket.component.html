<form
  id="new-ticket"
  (ngSubmit)="onSubmit(title.value, text.value, form)"
  #form
>
  <app-control label="Title">
    <input name="title" id="title" #title />
  </app-control>
  <app-control label="Request">
    <textarea name="text" id="text" #text></textarea>
  </app-control>
  <p>
    <app-button label=" Submit " logo=" ⌲ " />
  </p>
</form>
